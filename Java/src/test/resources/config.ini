[sortbenchmark]
version = 1.0.8 (added shareInstrumenter)

[helper]
# Set instrument to true if you want to get statistics on hits, swaps, compares, etc.
# When instrument is true, results of sorting are always checked.
# Only if instrument is true does the instrumenting section become significant.
# If you do set instrument to true, you should probably also set cutoff to 1
instrument =
# The following only applies when instrument is false. It checks the results of every sort.
# TRUE HERE, and false in main/resources: a test must not be able to pass on a sort which
# did not sort, whereas a benchmark must not pay for an O(n) check on every run.
checksorted = true
# For testing purposes, it's good to have an explicit seed...
seed = 0
# The following value represents the smallest number of elements which will continue to follow recurse.
# The optimal default cutoff for mergesort and dualpivotquicksort is 20 (based on benchmarking)
# you only need to change this if you want a cutoff different from the default.
# (normally only if instrument is true).
# If you want to disable the cutoff mechanism, use the value 1 (not 0).
cutoff =
# the following cutoff value is only used by MSD. The default value is 256.
msdcutoff =

[instrumenting]
# The options in this section apply only if instrument (in [helper]) is set to true.
# The following normally should be true:
showStats = true
swaps = true
compares = true
copies = true
hits = true
lookups = true
# The following settings slow everything down a lot so keep fixes false and inversions small (or zero)
fixes = false
inversions = 0
# the following value for runs (defaults to 1) is used only for the statistics and therefore only when instrument is true.
# it is usually overridden by an explicit number of runs.
runs =
# The following controls whether a hybrid sort (such as a linearithmic sort with a cutoff value) shares the same instrumenter,
# or whether the two are considered independent.
shareInstrumenter = true

[timer]
# The following controls whether we see the progress indicator. It should not make any difference to the timing.
showprogress = true

[benchmarkstringsorters]
# the following number determines the number of runs of each test. The default is 100,000,000.
totalwork = 1000000
# the following is Timsort but uses a different benchmark method.
puresystemsort =
bucketsort =
LSD =
MSD = true
timsort =
mergesort =
quicksort =
quicksort3way =
quicksortDualPivot =
heapsort =
introsort =
shellsort =
# this is for optimized insertion sort
insertionsortopt =
insertionsort =
bubblesort =
selectionsort =
randomsort =
# NOTE ini4j treats "#" as starting a comment only at the beginning of a line,
# so an inline comment becomes part of the value and getInt then throws.
# the following is only used by the "common words benchmark", which is currently not implemented.
words = 1000
# ditto
runs = 1000
# The default mode for Shell sort is 4
shellsortmode =
# This applies only to Shell sort
trackinversions =

[mergesort]
# consider setting the insurance to true if you think the input may be partially ordered.
insurance =
# there is no downside to using the nocopy option. The effect is to make the code more complex but runtime will always be less.
nocopy = true

[quicksort]
verifysortedpartitions =

[benchmarkintegersorters]
totalwork = 1000000
bucketsort =
bucketsize =
# the following actually uses DualPivotQuicksort
quicksort =
shellsort =
mode = 4

[benchmarkdatesorters]
timsort =
n = 100000

[operationsbenchmark]
nlargest = 10000000
repetitions = 10
